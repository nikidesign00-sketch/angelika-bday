<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>С днем рождения, Анжелика!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: radial-gradient(ellipse at 50% 30%, #3a1c6e 0%, #1a0b33 60%, #0d0620 100%);
    font-family: Pacifico, cursive;
    color: #fff;
  }

  #stickers { position: fixed; inset: 0; }
  #stickers video {
    position: absolute;
    width: var(--s); height: var(--s);
    object-fit: contain;
    opacity: .85;
    animation: bob var(--d) ease-in-out infinite alternate;
  }
  @keyframes bob {
    from { transform: translateY(-8px) rotate(-6deg); }
    to   { transform: translateY(8px) rotate(6deg); }
  }

  #balloons {
    position: fixed; inset: 0; z-index: 2;
    width: 100%; height: 100%; object-fit: contain;
    pointer-events: none;
    transition: opacity 1s;
  }
  #balloons.gone { opacity: 0; }

  /* заголовок и торт одной колонкой по центру */
  main {
    position: fixed; inset: 0; z-index: 3;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    pointer-events: none;
  }
  h1 {
    position: relative; z-index: 1;
    margin: 0 0 -6vh; padding: 0 16px; text-align: center;
    font-weight: 400; font-size: clamp(36px, 7vw, 84px); line-height: 1.25;
    text-shadow: 0 4px 24px #ff3d8b99;
    opacity: 0; transform: scale(.8);
    transition: opacity 1s, transform 1s cubic-bezier(.2, 1.6, .4, 1);
  }
  #cake {
    width: min(92vw, 600px, 70vh); aspect-ratio: 1;
    transform: translateY(100vh);
    transition: transform 1.4s cubic-bezier(.2, 1.3, .4, 1);
  }

  body.cake h1 { opacity: 1; transform: none; }
  body.cake #cake { transform: none; }

  @media (prefers-reduced-motion: reduce) {
    #stickers video { animation: none; }
  }
</style>
</head>
<body>
<div id="stickers"></div>
<video id="balloons" muted playsinline preload="auto"></video>
<main>
  <h1>С днем рождения, Анжелика!</h1>
  <canvas id="cake"></canvas>
</main>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<script>
  // Safari не умеет альфу в VP9 WebM, ему отдаём HEVC с альфой (.mov)
  const ext = /^((?!chrome|android|crios|fxios).)*safari/i.test(navigator.userAgent) ? 'mov' : 'webm';
  const STICKERS = 19;

  // Стикеры: по одному в ячейке сетки со случайным сдвигом
  const box = document.getElementById('stickers');
  const aspect = innerWidth / innerHeight || 16 / 9;
  const cols = Math.ceil(Math.sqrt(STICKERS * aspect)), rows = Math.ceil(STICKERS / cols);
  box.style.cssText = `--cw: calc(100vw / ${cols}); --ch: calc(100vh / ${rows}); --s: calc(min(var(--cw), var(--ch)) * .8)`;
  for (let i = 0; i < STICKERS; i++) {
    const v = document.createElement('video');
    Object.assign(v, { muted: true, loop: true, autoplay: true, playsInline: true,
                       src: `stickers/${i}.${ext}`, poster: `stickers/${i}.webp` });
    const cell = Math.floor(i * cols * rows / STICKERS), rx = Math.random(), ry = Math.random();
    v.style.left = `calc(var(--cw) * ${cell % cols + rx} - var(--s) * ${rx})`;
    v.style.top = `calc(var(--ch) * ${Math.floor(cell / cols) + ry} - var(--s) * ${ry})`;
    v.style.setProperty('--d', 2 + Math.random() * 2 + 's');
    v.style.animationDelay = -Math.random() * 4 + 's';
    box.append(v);
  }

  // Конфетти + блёстки
  const gold = ['#ffd700', '#fff3b0', '#ffe066', '#ffffff', '#f5c542'];
  function party() {
    const opts = { disableForReducedMotion: true, zIndex: 4 };
    confetti({ ...opts, particleCount: 160, spread: 100, origin: { y: .7 } });
    confetti({ ...opts, particleCount: 80, angle: 60, spread: 60, origin: { x: 0, y: .8 } });
    confetti({ ...opts, particleCount: 80, angle: 120, spread: 60, origin: { x: 1, y: .8 } });
    confetti({ ...opts, particleCount: 60, spread: 360, startVelocity: 30, shapes: ['star'],
               colors: gold, scalar: 1.2, origin: { y: .4 } });
    // мелкие медленно падающие блёстки по всей ширине
    confetti({ ...opts, particleCount: 250, spread: 180, startVelocity: 15, gravity: .35, ticks: 500,
               scalar: .45, shapes: ['circle'], colors: gold, origin: { y: -.1 } , angle: 270 });
  }

  const balloons = document.getElementById('balloons');
  balloons.src = `media/balloons.${ext}`;

  let shown = false;
  function showCake() {
    if (shown) return;
    shown = true;
    balloons.classList.add('gone');
    document.body.classList.add('cake');
    setTimeout(party, 600);
  }
  // видео кончается на полной надписи — держим её секунду
  balloons.addEventListener('ended', () => setTimeout(showCake, 1000));

  function start() {
    party();
    // автоплей запрещён (режим энергосбережения iOS) — сразу к торту
    balloons.play().catch(e => e.name == 'NotAllowedError' && showCake());
    setTimeout(showCake, 4500);
  }
  // в фоновой вкладке браузер ставит видео на паузу — ждём, пока её откроют
  if (document.visibilityState == 'visible') start();
  else document.addEventListener('visibilitychange', start, { once: true });
  addEventListener('click', party);
</script>
<script type="module">
  import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

  const TOPPER = 'cake/topper.png'; // картинка, которая выезжает из торта
  const TOPPER_H = 1;               // её высота
  const R = 1, H = .83;             // радиус и высота торта

  const canvas = document.getElementById('cake');
  const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.localClippingEnabled = true;
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(30, 1, .1, 50);
  camera.position.set(0, 2.5, 4.6);
  camera.lookAt(0, .45, 0);

  // свет: сверху-небо/снизу-тень, основной слева, розовая заливка справа, контровой сзади
  scene.add(new THREE.HemisphereLight(0xffffff, 0x2a0b3d, .5));
  for (const [color, power, x, y, z] of [[0xffffff, 4, -3, 2.5, 3], [0xff9ad5, .6, 3.5, 1, 2], [0xffffff, 4, 0, 1.5, -4]]) {
    const light = new THREE.DirectionalLight(color, power);
    light.position.set(x, y, z);
    scene.add(light);
  }

  const loader = new THREE.TextureLoader();
  const tex = (url, onLoad) => {
    const t = loader.load(url, onLoad);
    t.colorSpace = THREE.SRGBColorSpace;
    t.anisotropy = 8;
    return t;
  };

  const cake = new THREE.Group();
  scene.add(cake);

  // бок: крем, разглаженный лопаткой. Рисуем карту высот, из неё — нормали (объём)
  // и лёгкие переливы цвета. Всё рисуется трижды со сдвигом ±w — шва по кругу нет
  function creamSide() {
    const w = 2048, h = 512, rnd = (a, b) => a + Math.random() * (b - a);
    const canvas2d = () => {
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      return c.getContext('2d');
    };
    const g = canvas2d();
    g.fillStyle = '#808080';
    g.fillRect(0, 0, w, h);
    // слой рисуется без фильтра и размывается одним drawImage:
    // blur на каждом штрихе в тысячи вызовов роняет canvas
    const layer = (blur, draw) => {
      const l = canvas2d();
      draw(l);
      g.filter = `blur(${blur}px)`;
      g.drawImage(l.canvas, 0, 0);
      g.filter = 'none';
    };
    const wrap = draw => { for (const dx of [-w, 0, w]) draw(dx); };

    // широкие пологие волны
    layer(28, l => {
      for (let i = 0; i < 40; i++) {
        const x = rnd(0, w), y = rnd(0, h), len = rnd(300, 900), v = Math.random() < .5 ? 255 : 0;
        l.strokeStyle = `rgba(${v},${v},${v},${rnd(.25, .4)})`;
        l.lineWidth = rnd(40, 110);
        wrap(dx => { l.beginPath(); l.moveTo(x + dx, y); l.lineTo(x + dx + len, y + rnd(-8, 8)); l.stroke(); });
      }
    });
    // следы лопатки: тонкий гребень + ступенька под ним, концы сходят на нет
    layer(1.5, l => {
      for (let i = 0; i < 16; i++) {
        const x = rnd(0, w), y = rnd(0, h), len = rnd(300, 1000), dy = rnd(-10, 10), a = rnd(.12, .3);
        const line = (off, color, width) => wrap(dx => {
          const grad = l.createLinearGradient(x + dx, 0, x + dx + len, 0);
          grad.addColorStop(0, `rgba(${color},0)`);
          grad.addColorStop(rnd(.15, .4), `rgba(${color},${a})`);
          grad.addColorStop(rnd(.6, .85), `rgba(${color},${a})`);
          grad.addColorStop(1, `rgba(${color},0)`);
          l.strokeStyle = grad;
          l.lineWidth = width;
          l.beginPath();
          l.moveTo(x + dx, y + off);
          l.quadraticCurveTo(x + dx + len / 2, y + off + dy, x + dx + len, y + off + dy * .3);
          l.stroke();
        });
        const width = rnd(1.5, 4);
        line(0, '255,255,255', width);
        line(width + 1.5, '0,0,0', width * 1.6);
      }
    });
    // мелкие поры от пузырьков воздуха и матовое зерно
    layer(.8, l => {
      for (let i = 0; i < 5000; i++) {
        const v = Math.random() < .65 ? 0 : 255;
        l.fillStyle = `rgba(${v},${v},${v},${rnd(.03, .1)})`;
        l.beginPath();
        l.arc(rnd(0, w), rnd(0, h), rnd(.8, 2.6), 0, Math.PI * 2);
        l.fill();
      }
    });
    const H8 = g.getImageData(0, 0, w, h).data;

    // нормали из высот (с заворотом по x)
    const nc = document.createElement('canvas');
    nc.width = w; nc.height = h;
    const nctx = nc.getContext('2d'), nimg = nctx.createImageData(w, h), N = nimg.data;
    const cc = document.createElement('canvas');
    cc.width = w; cc.height = h;
    const cctx = cc.getContext('2d'), cimg = cctx.createImageData(w, h), C = cimg.data;
    const at = (x, y) => H8[((Math.min(h - 1, Math.max(0, y)) * w) + ((x + w) % w)) * 4];
    const k = 2.5;  // сила рельефа
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const nx = (at(x - 2, y) - at(x + 2, y)) / 255 * k, ny = (at(x, y + 2) - at(x, y - 2)) / 255 * k;
      const l = Math.hypot(nx, ny, 1), i = (y * w + x) * 4;
      N[i] = (nx / l * .5 + .5) * 255; N[i + 1] = (ny / l * .5 + .5) * 255; N[i + 2] = (1 / l * .5 + .5) * 255; N[i + 3] = 255;
      const t = (at(x, y) - 128) / 128;           // выше — чуть светлее
      C[i] = 233 + t * 14; C[i + 1] = 83 + t * 14; C[i + 2] = 176 + t * 12; C[i + 3] = 255;
    }
    nctx.putImageData(nimg, 0, 0);
    cctx.putImageData(cimg, 0, 0);

    const map = new THREE.CanvasTexture(cc), normalMap = new THREE.CanvasTexture(nc);
    map.colorSpace = THREE.SRGBColorSpace;
    for (const t of [map, normalMap]) { t.wrapS = THREE.RepeatWrapping; t.repeat.x = 2; t.anisotropy = 8; }
    return new THREE.MeshStandardMaterial({ map, normalMap, roughness: .62 });
  }
  const side = creamSide();
  const bottom = new THREE.MeshBasicMaterial({ color: 0xb03c85 });
  // у CylinderGeometry три группы материалов: бок, верх, низ
  cake.add(new THREE.Mesh(new THREE.CylinderGeometry(R, R, H, 128),
    [side, new THREE.MeshBasicMaterial({ map: tex('cake/top.webp') }), bottom]));

  // картинка стоит в центре; всё, что ниже поверхности торта, отрезается —
  // так она «выезжает» изнутри
  const hiddenY = H / 2 - TOPPER_H / 2, shownY = H / 2 + TOPPER_H / 2 - .04;
  let topper, riseStart = null;
  tex(TOPPER, t => {
    topper = new THREE.Mesh(new THREE.PlaneGeometry(TOPPER_H * t.image.width / t.image.height, TOPPER_H),
      new THREE.MeshBasicMaterial({ map: t, transparent: true, alphaTest: .05, side: THREE.DoubleSide,
        clippingPlanes: [new THREE.Plane(new THREE.Vector3(0, 1, 0), -H / 2)] }));
    topper.position.y = hiddenY;
    cake.add(topper);
  });
  const easeOutBack = p => 1 + 2.2 * (p - 1) ** 3 + 1.2 * (p - 1) ** 2;

  function resize() {
    const w = canvas.clientWidth;
    renderer.setSize(w, w, false);
  }
  addEventListener('resize', resize);
  resize();

  renderer.setAnimationLoop(ms => {
    cake.rotation.y = ms / 1000 * .5;   // рад/с, не зависит от частоты экрана
    if (topper && document.body.classList.contains('cake')) {
      riseStart ??= ms + 1300;          // ждём, пока торт доедет снизу (transition 1.4s)
      const p = Math.min(1, Math.max(0, (ms - riseStart) / 1200));
      topper.position.y = hiddenY + (shownY - hiddenY) * easeOutBack(p);
    }
    renderer.render(scene, camera);
  });
</script>
</body>
</html>
