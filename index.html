<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>С днем рождения, Анжелика!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: radial-gradient(ellipse at 50% 30%, #3a1c6e 0%, #1a0b33 60%, #0d0620 100%);
    font-family: Pacifico, cursive;
    color: #fff;
  }

  #stickers { position: fixed; inset: 0; }
  #stickers video {
    position: absolute;
    width: var(--s); height: var(--s);
    object-fit: contain;
    opacity: .85;
    animation: bob var(--d) ease-in-out infinite alternate;
  }
  @keyframes bob {
    from { transform: translateY(-8px) rotate(-6deg); }
    to   { transform: translateY(8px) rotate(6deg); }
  }

  #balloons {
    position: fixed; inset: 0; z-index: 2;
    width: 100%; height: 100%; object-fit: contain;
    pointer-events: none;
    transition: opacity 1s;
  }
  #balloons.gone { opacity: 0; }

  h1 {
    position: fixed; z-index: 3; left: 0; right: 0; top: 8vh;
    margin: 0; padding: 0 16px; text-align: center;
    font-weight: 400; font-size: clamp(40px, 8vw, 96px);
    text-shadow: 0 4px 24px #ff3d8b99;
    opacity: 0; transform: scale(.8);
    transition: opacity 1s, transform 1s cubic-bezier(.2, 1.6, .4, 1);
  }

  #cake {
    position: fixed; z-index: 3; left: 50%; bottom: 0;
    width: min(80vw, 520px); aspect-ratio: 1;
    transform: translate(-50%, 110%);
    transition: transform 1.4s cubic-bezier(.2, 1.3, .4, 1);
  }

  body.cake h1 { opacity: 1; transform: none; }
  body.cake #cake { transform: translate(-50%, -4vh); }

  @media (prefers-reduced-motion: reduce) {
    #stickers video { animation: none; }
  }
</style>
</head>
<body>
<div id="stickers"></div>
<video id="balloons" muted playsinline preload="auto"></video>
<h1>С днем рождения, Анжелика!</h1>
<canvas id="cake"></canvas>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<script>
  // Safari не умеет альфу в VP9 WebM, ему отдаём HEVC с альфой (.mov)
  const ext = /^((?!chrome|android|crios|fxios).)*safari/i.test(navigator.userAgent) ? 'mov' : 'webm';
  const STICKERS = 19;

  // Стикеры: по одному в ячейке сетки со случайным сдвигом
  const box = document.getElementById('stickers');
  const aspect = innerWidth / innerHeight || 16 / 9;
  const cols = Math.ceil(Math.sqrt(STICKERS * aspect)), rows = Math.ceil(STICKERS / cols);
  box.style.cssText = `--cw: calc(100vw / ${cols}); --ch: calc(100vh / ${rows}); --s: calc(min(var(--cw), var(--ch)) * .8)`;
  for (let i = 0; i < STICKERS; i++) {
    const v = document.createElement('video');
    Object.assign(v, { muted: true, loop: true, autoplay: true, playsInline: true,
                       src: `stickers/${i}.${ext}`, poster: `stickers/${i}.webp` });
    const cell = Math.floor(i * cols * rows / STICKERS), rx = Math.random(), ry = Math.random();
    v.style.left = `calc(var(--cw) * ${cell % cols + rx} - var(--s) * ${rx})`;
    v.style.top = `calc(var(--ch) * ${Math.floor(cell / cols) + ry} - var(--s) * ${ry})`;
    v.style.setProperty('--d', 2 + Math.random() * 2 + 's');
    v.style.animationDelay = -Math.random() * 4 + 's';
    box.append(v);
  }

  // Конфетти + блёстки
  const gold = ['#ffd700', '#fff3b0', '#ffe066', '#ffffff', '#f5c542'];
  function party() {
    const opts = { disableForReducedMotion: true, zIndex: 4 };
    confetti({ ...opts, particleCount: 160, spread: 100, origin: { y: .7 } });
    confetti({ ...opts, particleCount: 80, angle: 60, spread: 60, origin: { x: 0, y: .8 } });
    confetti({ ...opts, particleCount: 80, angle: 120, spread: 60, origin: { x: 1, y: .8 } });
    confetti({ ...opts, particleCount: 60, spread: 360, startVelocity: 30, shapes: ['star'],
               colors: gold, scalar: 1.2, origin: { y: .4 } });
    // мелкие медленно падающие блёстки по всей ширине
    confetti({ ...opts, particleCount: 250, spread: 180, startVelocity: 15, gravity: .35, ticks: 500,
               scalar: .45, shapes: ['circle'], colors: gold, origin: { y: -.1 } , angle: 270 });
  }

  const balloons = document.getElementById('balloons');
  balloons.src = `media/balloons.${ext}`;

  let shown = false;
  function showCake() {
    if (shown) return;
    shown = true;
    balloons.classList.add('gone');
    document.body.classList.add('cake');
    setTimeout(party, 600);
  }
  balloons.addEventListener('ended', showCake);

  function start() {
    party();
    // автоплей запрещён (режим энергосбережения iOS) — сразу к торту
    balloons.play().catch(e => e.name == 'NotAllowedError' && showCake());
    setTimeout(showCake, 5500);
  }
  // в фоновой вкладке браузер ставит видео на паузу — ждём, пока её откроют
  if (document.visibilityState == 'visible') start();
  else document.addEventListener('visibilitychange', start, { once: true });
  addEventListener('click', party);
</script>
<script type="module">
  import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

  // PNG-фото, которые торчат из торта: добавить файлы в cake/ и перечислить здесь
  const TOPPERS = [];
  const size = .7;                 // высота фото
  const PINK = 0xe953b0;           // цвет блёсток с текстуры
  const R = 1, H = .7;             // радиус и высота торта

  const canvas = document.getElementById('cake');
  const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(30, 1, .1, 50);
  camera.position.set(0, 2.6, 3.8);
  camera.lookAt(0, .3, 0);

  scene.add(new THREE.AmbientLight(0xffffff, 1.6));
  const sun = new THREE.DirectionalLight(0xffffff, 2);
  sun.position.set(2, 3, 4);
  scene.add(sun);

  const loader = new THREE.TextureLoader();
  const tex = (url, onLoad) => { const t = loader.load(url, onLoad); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t; };

  const cake = new THREE.Group();
  scene.add(cake);
  // у CylinderGeometry три группы материалов: бок, верх, низ
  const side = new THREE.MeshStandardMaterial({ color: PINK, roughness: .45 });
  cake.add(new THREE.Mesh(new THREE.CylinderGeometry(R, R, H, 96),
    [side, new THREE.MeshBasicMaterial({ map: tex('cake/top.webp') }), side]));

  TOPPERS.forEach((url, i) => {
    // размер по пропорциям картинки, когда она загрузится
    const t = tex(url, t => m.scale.set(size * t.image.width / t.image.height, size, 1));
    const m = new THREE.Mesh(new THREE.PlaneGeometry(1, 1),
      new THREE.MeshBasicMaterial({ map: t, transparent: true, alphaTest: .05, side: THREE.DoubleSide }));
    const a = i / TOPPERS.length * Math.PI * 2;
    m.position.set(Math.sin(a) * R * .55, H / 2 + size / 2 - .05, Math.cos(a) * R * .55);
    m.rotation.y = a;
    cake.add(m);
  });

  function resize() {
    const w = canvas.clientWidth;
    renderer.setSize(w, w, false);
  }
  addEventListener('resize', resize);
  resize();

  renderer.setAnimationLoop(ms => {
    cake.rotation.y = ms / 1000 * .5;   // рад/с, не зависит от частоты экрана
    renderer.render(scene, camera);
  });
</script>
</body>
</html>
