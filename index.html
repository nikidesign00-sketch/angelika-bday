<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>С днем рождения, Анжелика!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: radial-gradient(ellipse at 50% 30%, #3a1c6e 0%, #1a0b33 60%, #0d0620 100%);
    font-family: Pacifico, cursive;
    color: #fff;
  }

  #stickers { position: fixed; inset: 0; }
  #stickers video {
    position: absolute;
    width: var(--s); height: var(--s);
    object-fit: contain;
    opacity: .85;
    animation: bob var(--d) ease-in-out infinite alternate;
  }
  @keyframes bob {
    from { transform: translateY(-8px) rotate(-6deg); }
    to   { transform: translateY(8px) rotate(6deg); }
  }

  #balloons {
    position: fixed; inset: 0; z-index: 2;
    width: 100%; height: 100%; object-fit: contain;
    pointer-events: none;
    transition: opacity 1s;
  }
  #balloons.gone { opacity: 0; }

  /* заголовок и торт одной колонкой по центру */
  main {
    position: fixed; inset: 0; z-index: 3;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    pointer-events: none;
  }
  h1 {
    position: relative; z-index: 1;
    margin: 0 0 -6vh; padding: 0 16px; text-align: center;
    font-weight: 400; font-size: clamp(36px, 7vw, 84px); line-height: 1.25;
    text-shadow: 0 4px 24px #ff3d8b99;
    opacity: 0; transform: scale(.8);
    transition: opacity 1s, transform 1s cubic-bezier(.2, 1.6, .4, 1);
  }
  #cake {
    width: min(92vw, 600px, 70vh); aspect-ratio: 1;
    transform: translateY(100vh);
    transition: transform 1.4s cubic-bezier(.2, 1.3, .4, 1);
  }

  body.cake h1 { opacity: 1; transform: none; }
  body.cake #cake { transform: none; }

  @media (prefers-reduced-motion: reduce) {
    #stickers video { animation: none; }
  }
</style>
</head>
<body>
<div id="stickers"></div>
<video id="balloons" muted playsinline preload="auto"></video>
<main>
  <h1>С днем рождения, Анжелика!</h1>
  <canvas id="cake"></canvas>
</main>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<script>
  // Safari не умеет альфу в VP9 WebM, ему отдаём HEVC с альфой (.mov)
  const ext = /^((?!chrome|android|crios|fxios).)*safari/i.test(navigator.userAgent) ? 'mov' : 'webm';
  const STICKERS = 19;

  // Стикеры: по одному в ячейке сетки со случайным сдвигом
  const box = document.getElementById('stickers');
  const aspect = innerWidth / innerHeight || 16 / 9;
  const cols = Math.ceil(Math.sqrt(STICKERS * aspect)), rows = Math.ceil(STICKERS / cols);
  box.style.cssText = `--cw: calc(100vw / ${cols}); --ch: calc(100vh / ${rows}); --s: calc(min(var(--cw), var(--ch)) * .8)`;
  for (let i = 0; i < STICKERS; i++) {
    const v = document.createElement('video');
    Object.assign(v, { muted: true, loop: true, autoplay: true, playsInline: true,
                       src: `stickers/${i}.${ext}`, poster: `stickers/${i}.webp` });
    const cell = Math.floor(i * cols * rows / STICKERS), rx = Math.random(), ry = Math.random();
    v.style.left = `calc(var(--cw) * ${cell % cols + rx} - var(--s) * ${rx})`;
    v.style.top = `calc(var(--ch) * ${Math.floor(cell / cols) + ry} - var(--s) * ${ry})`;
    v.style.setProperty('--d', 2 + Math.random() * 2 + 's');
    v.style.animationDelay = -Math.random() * 4 + 's';
    box.append(v);
  }

  // Конфетти + блёстки
  const gold = ['#ffd700', '#fff3b0', '#ffe066', '#ffffff', '#f5c542'];
  function party() {
    const opts = { disableForReducedMotion: true, zIndex: 4 };
    confetti({ ...opts, particleCount: 160, spread: 100, origin: { y: .7 } });
    confetti({ ...opts, particleCount: 80, angle: 60, spread: 60, origin: { x: 0, y: .8 } });
    confetti({ ...opts, particleCount: 80, angle: 120, spread: 60, origin: { x: 1, y: .8 } });
    confetti({ ...opts, particleCount: 60, spread: 360, startVelocity: 30, shapes: ['star'],
               colors: gold, scalar: 1.2, origin: { y: .4 } });
    // мелкие медленно падающие блёстки по всей ширине
    confetti({ ...opts, particleCount: 250, spread: 180, startVelocity: 15, gravity: .35, ticks: 500,
               scalar: .45, shapes: ['circle'], colors: gold, origin: { y: -.1 } , angle: 270 });
  }

  const balloons = document.getElementById('balloons');
  balloons.src = `media/balloons.${ext}`;

  let shown = false;
  function showCake() {
    if (shown) return;
    shown = true;
    balloons.classList.add('gone');
    document.body.classList.add('cake');
    setTimeout(party, 600);
  }
  balloons.addEventListener('ended', showCake);

  function start() {
    party();
    // автоплей запрещён (режим энергосбережения iOS) — сразу к торту
    balloons.play().catch(e => e.name == 'NotAllowedError' && showCake());
    setTimeout(showCake, 5500);
  }
  // в фоновой вкладке браузер ставит видео на паузу — ждём, пока её откроют
  if (document.visibilityState == 'visible') start();
  else document.addEventListener('visibilitychange', start, { once: true });
  addEventListener('click', party);
</script>
<script type="module">
  import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

  const TOPPER = 'cake/topper.png'; // картинка, которая выезжает из торта
  const TOPPER_H = 1;               // её высота
  const R = 1, H = .83;             // радиус и высота торта

  const canvas = document.getElementById('cake');
  const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.localClippingEnabled = true;
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(30, 1, .1, 50);
  camera.position.set(0, 2.5, 4.6);
  camera.lookAt(0, .45, 0);

  // свет: сверху-небо/снизу-тень, основной слева, розовая заливка справа, контровой сзади
  scene.add(new THREE.HemisphereLight(0xffffff, 0x2a0b3d, .5));
  for (const [color, power, x, y, z] of [[0xffffff, 4, -3, 2.5, 3], [0xff9ad5, .6, 3.5, 1, 2], [0xffffff, 4, 0, 1.5, -4]]) {
    const light = new THREE.DirectionalLight(color, power);
    light.position.set(x, y, z);
    scene.add(light);
  }

  const loader = new THREE.TextureLoader();
  const tex = (url, onLoad) => {
    const t = loader.load(url, onLoad);
    t.colorSpace = THREE.SRGBColorSpace;
    t.anisotropy = 8;
    return t;
  };

  const cake = new THREE.Group();
  scene.add(cake);

  // творожный крем: розовая база, горизонтальные мазки лопатки и зерно.
  // relief — рельеф (серый), из него же подкрашивается цвет
  function creamTextures() {
    const w = 1024, h = 256;
    const relief = document.createElement('canvas');
    relief.width = w; relief.height = h;
    const g = relief.getContext('2d');
    g.fillStyle = '#808080';
    g.fillRect(0, 0, w, h);
    g.lineCap = 'round';
    g.filter = 'blur(4px)';
    for (let i = 0; i < 90; i++) {
      const x = Math.random() * w, y = Math.random() * h, len = 200 + Math.random() * 500;
      const bend = (Math.random() - .5) * 10, end = (Math.random() - .5) * 6;
      const v = Math.random() < .5 ? 255 : 0;
      g.strokeStyle = `rgba(${v},${v},${v},${.04 + Math.random() * .06})`;
      g.lineWidth = 10 + Math.random() * 30;
      for (const dx of [-w, 0, w]) {  // копии по краям — шов по кругу не виден
        g.beginPath();
        g.moveTo(x + dx, y);
        g.quadraticCurveTo(x + dx + len / 2, y + bend, x + dx + len, y + end);
        g.stroke();
      }
    }
    g.filter = 'none';
    const img = g.getImageData(0, 0, w, h);
    for (let i = 0; i < img.data.length; i += 4) {
      const n = (Math.random() - .5) * 8;
      img.data[i] += n; img.data[i + 1] += n; img.data[i + 2] += n;
    }
    g.putImageData(img, 0, 0);

    const color = document.createElement('canvas');
    color.width = w; color.height = h;
    const c = color.getContext('2d');
    c.fillStyle = '#e953b0';
    c.fillRect(0, 0, w, h);
    c.globalCompositeOperation = 'overlay';
    c.globalAlpha = .35;
    c.drawImage(relief, 0, 0);

    const map = new THREE.CanvasTexture(color), bump = new THREE.CanvasTexture(relief);
    map.colorSpace = THREE.SRGBColorSpace;
    for (const t of [map, bump]) { t.wrapS = THREE.RepeatWrapping; t.repeat.x = 2; t.anisotropy = 8; }
    return { map, bump };
  }
  const { map, bump } = creamTextures();
  const cream = new THREE.MeshStandardMaterial({ map, bumpMap: bump, bumpScale: 1.5, roughness: .85 });

  // бок: профиль со скруглённым верхним краем, вращённый вокруг оси
  const rr = .08, profile = [new THREE.Vector2(R - .02, -H / 2), new THREE.Vector2(R, -H / 2 + .02)];
  for (let i = 0; i <= 8; i++) {
    const a = i / 8 * Math.PI / 2;
    profile.push(new THREE.Vector2(R - rr + Math.cos(a) * rr, H / 2 - rr + Math.sin(a) * rr));
  }
  const sideGeo = new THREE.LatheGeometry(profile, 160);
  // лёгкая неровность, как при ручном выравнивании крема
  const pos = sideGeo.attributes.position, uv = sideGeo.attributes.uv;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i), th = Math.atan2(z, x);
    const k = 1 + .006 * Math.sin(3 * th + 1) + .004 * Math.sin(7 * th + y * 6);
    pos.setX(i, x * k); pos.setZ(i, z * k);
    uv.setY(i, (y + H / 2) / H);  // текстура по высоте, а не по точкам профиля (их много в скруглении)
  }
  sideGeo.computeVertexNormals();
  cake.add(new THREE.Mesh(sideGeo, cream));

  // верх с картинкой — плоский круг чуть заходит под скругление
  const top = new THREE.Mesh(new THREE.CircleGeometry(R - rr + .015, 128),
    new THREE.MeshBasicMaterial({ map: tex('cake/top.webp') }));
  top.rotation.x = -Math.PI / 2;
  top.position.y = H / 2 + .001;
  cake.add(top);
  const base = new THREE.Mesh(new THREE.CircleGeometry(R, 64), new THREE.MeshBasicMaterial({ color: 0xb03c85 }));
  base.rotation.x = Math.PI / 2;
  base.position.y = -H / 2;
  cake.add(base);

  // картинка стоит в центре; всё, что ниже поверхности торта, отрезается —
  // так она «выезжает» изнутри
  const hiddenY = H / 2 - TOPPER_H / 2, shownY = H / 2 + TOPPER_H / 2 - .04;
  let topper, riseStart = null;
  tex(TOPPER, t => {
    topper = new THREE.Mesh(new THREE.PlaneGeometry(TOPPER_H * t.image.width / t.image.height, TOPPER_H),
      new THREE.MeshBasicMaterial({ map: t, transparent: true, alphaTest: .05, side: THREE.DoubleSide,
        clippingPlanes: [new THREE.Plane(new THREE.Vector3(0, 1, 0), -H / 2)] }));
    topper.position.y = hiddenY;
    cake.add(topper);
  });
  const easeOutBack = p => 1 + 2.2 * (p - 1) ** 3 + 1.2 * (p - 1) ** 2;

  function resize() {
    const w = canvas.clientWidth;
    renderer.setSize(w, w, false);
  }
  addEventListener('resize', resize);
  resize();

  renderer.setAnimationLoop(ms => {
    cake.rotation.y = ms / 1000 * .5;   // рад/с, не зависит от частоты экрана
    if (topper && document.body.classList.contains('cake')) {
      riseStart ??= ms + 1300;          // ждём, пока торт доедет снизу (transition 1.4s)
      const p = Math.min(1, Math.max(0, (ms - riseStart) / 1200));
      topper.position.y = hiddenY + (shownY - hiddenY) * easeOutBack(p);
    }
    renderer.render(scene, camera);
  });
</script>
</body>
</html>
